<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실행 기록</title>
<style>body{background:#10151f;color:#e2e8f0;font:15px system-ui;margin:30px}h1{font-size:24px}button,select,input{background:#202c40;color:inherit;border:1px solid #40536c;padding:9px;border-radius:6px}article{border:1px solid #344154;border-radius:10px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace}.muted{color:#97a9bf}summary{cursor:pointer}header{position:sticky;top:0;background:#10151f;padding:10px 0}</style>
<header><h1>대화와 실행 기록</h1><p id="meta"></p><select id="agent"><option value="">전체 에이전트</option><option value="a">Agent A</option><option value="b">Agent B</option></select> <input id="query" placeholder="기록 검색"> <label><input type="checkbox" id="raw"> 원시 이벤트 포함</label></header><main id="events"></main>
<script>const DATA=/*RUN_DATA*/null;const $=s=>document.querySelector(s);$('#meta').textContent=`${DATA.run.id} · ${DATA.run.status} · ${DATA.events.length}개 이벤트`;
function draw(){const host=$('#events');host.replaceChildren();for(const e of DATA.events){if($('#agent').value&&e.agent!==$('#agent').value)continue;if(!$('#raw').checked&&['provider_event','session','meter','text','final_text'].includes(e.kind))continue;const full=JSON.stringify(e.payload,null,2);if($('#query').value&&!full.toLowerCase().includes($('#query').value.toLowerCase()))continue;const a=document.createElement('article'),h=document.createElement('strong'),meta=document.createElement('p'),pre=document.createElement('pre');h.textContent=`#${e.seq} ${e.agent||'관리자'} · ${e.kind}`;meta.className='muted';meta.textContent=e.timestamp;pre.textContent=full;a.append(h,meta,pre);host.append(a)}}for(const s of ['#agent','#query','#raw'])$(s).addEventListener('input',draw);draw();</script></html>
